models:
  chat: qwen3:8b
  # qwen2.5vl:3b is sharper but needs ~8.4 GB free RAM; moondream fits
  # alongside other apps on a typical laptop. Swap back if you free up memory.
  vision: moondream

cameras:
  # name: OpenCV index (webcam) or RTSP URL (IP camera)
  webcam: 0
  # front_door: rtsp://user:password@192.168.1.50:554/stream1
default_camera: webcam

watch:
  alert_cooldown_seconds: 30
  snapshot_dir: data/snapshots
  person_confidence: 0.5

voice:
  enabled: true
  wake_word: hey_jarvis_v0.1
  wake_threshold: 0.4   # 0.0-1.0; lower = more sensitive (easier to trigger)
  stt_model: small
  stt_language: en

hud:
  enabled: true          # the floating "Jarvis orb" that shows it's listening
  corner: bottom-right   # bottom-right | bottom-left | top-right | top-left

apps:
  # extra app aliases -> command to launch (merged with built-ins)
  # spotify: spotify
